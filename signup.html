<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGO Sign Up</title>
    <link rel="stylesheet" href="signup.css">
    <script src="head-foot.js"></script>
</head>
<body>
    <div id="header"></div>
    <div class="container">
        <h1 >NGO Sign Up</h1>
        <form id="ngo-signup-form">
            <label for="name">NGO Name:</label><br>
            <input type="text" id="name" name="name" required>

            <label for="owner name">Owner Full Name:</label>
            <input type="text" id="owner name" name="owner name" required><br>

            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" required><br>

            <label for="username">Username:</label><br>
            <input type="text" id="username" name="username" required><br>

            <label for="password">Password:</label><br>
            <input type="password" id="password" name="password" required><br>

            <label for="confirm-password">Confirm Password:</label>
            <input type="password" id="confirm-password" name="confirm-password" required><br>

            <label for="description">NGO Description:</label><br>
            <textarea id="description" name="description" required></textarea><br>

            <label for="address">NGO Address:</label><br>
            <input type="text" id="address" name="address" required>

            <label for="police station">Nearest Police Station details:</label><br>
            <textarea id="police station" name="police station" required></textarea><br>

            <label for="phone">Phone Number:</label><br>
            <input type="number" min="5555555555" max="9999999999" id="phone" name="phone" required><br><br>

            <label for="aadhar">Owner aadhar card:</label>
            <input type="file" id="aadhar" name="aadhar" required><br><br>

            <label for="certificate">Authorised NGO Certificate:</label>
            <input type="file" id="certificate" name="certificate" required><br><br>


            <button type="submit">Sign Up</button>
        </form>
    </div>

    <script src="signup.js"></script>
    <div id="footer"></div>

</body>
</html>
