<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>news_ticker</title>

    <style>
.news-container {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  font-family: "Roboto", sans-serif;
  box-shadow: 0 4px 8px -4px rgb(0, 0, 0, 0.3);
}

.news-container .title {
  position: absolute;
  background: #df2020;
  height: 100%;
  display: flex;
  align-items: center;
  padding: 0, 24px;
  font-weight: bold;
  z-index: 200;
}

.news-container ul {
  display: flex;
  list-style: none;
  margin: 0;
  transform: translateX(-1000px);
}

.news-container ul li {
  white-space: nowrap;
  padding: 10px, 24px;
  color: #494949;
  position: relative;
}

.news-container ul li::after {
  content: "";
  width: 1px;
  height: 100%;
  background: #b8b8b8;
  position: absolute;
  top: 0;
  right: 0;
}

  .news-container ul li:last-child:after {
    display: none;
}

@keyframes scroll {
  from {
    transform: translateX(100%);
  }
  to {
    transform: translateX();
  }
}

    </style>
</head>
<body>
    <div class="news-container">
        <div class="title">
          BREAKING NEWS
        </div>
        <ul>
          <li>
            Lorem ipsum dolor sit amet consectetur adipisicing elit. Sequi?
          </li>
          <li>Lorem ipsum dolor sit.</li>
          <li>Lorem ipsum dolor sit amet consectetur.</li>
        </ul>
      </div>
    
</body>
</html>
